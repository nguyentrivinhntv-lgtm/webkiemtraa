services:
  # ==========================================
  # 1. BACKEND API SERVICE (Node.js + Express)
  # ==========================================
  - type: web
    name: webkiemtra-backend
    env: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production

  # ==========================================
  # 2. FRONTEND STATIC SITE (React + Vite)
  # ==========================================
  - type: static
    name: webkiemtra-frontend
    plan: free
    region: singapore
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
